apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: comprehensive-vm
  namespace: default
  labels:
    app: test-vm
    environment: lab
spec:
  running: false
  template:
    metadata:
      labels:
        kubevirt.io/vm: comprehensive-vm
        app: test-vm
    spec:
      domain:
        cpu:
          cores: 2
          threads: 1
          sockets: 1
        memory:
          guest: 2Gi
        devices:
          disks:
          - name: containerdisk
            disk:
              bus: virtio
          - name: cloudinitdisk
            disk:
              bus: virtio
          interfaces:
          - name: default
            masquerade: {}
          networkInterfaceMultiqueue: true
        machine:
          type: pc-q35-rhel8.4.0
        features:
          smm:
            enabled: true
          acpi: {}
      networks:
      - name: default
        pod: {}
      volumes:
      - name: containerdisk
        containerDisk:
          image: quay.io/kubevirt/cirros-container-disk-demo
      - name: cloudinitdisk
        cloudInitNoCloud:
          userDataBase64: I2Nsb3VkLWNvbmZpZwpwYXNzd29yZDogY2lyc29zCmNoYXNzd2Q6IEZhbHNlCnNzaF9wd2F1dGg6IFRydWUK
