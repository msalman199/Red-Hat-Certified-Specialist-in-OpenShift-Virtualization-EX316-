apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vmi-network-policy
  namespace: vmi-lab
spec:
  podSelector:
    matchLabels:
      kubevirt.io/domain: secure-vmi
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          access: allowed
    ports:
    - protocol: TCP
      port: 22
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to: []
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
