apiVersion: kubevirt.io/v1
kind: VirtualMachineInstance
metadata:
  name: basic-vmi
  namespace: vmi-lab
  labels:
    app: basic-vm
    environment: lab
spec:
  domain:
    cpu:
      cores: 1
    memory:
      guest: 1Gi
    devices:
      disks:
      - name: containerdisk
        disk:
          bus: virtio
      - name: cloudinitdisk
        disk:
          bus: virtio
      interfaces:
      - name: default
        masquerade: {}
    machine:
      type: q35
  networks:
  - name: default
    pod: {}
  volumes:
  - name: containerdisk
    containerDisk:
      image: quay.io/kubevirt/cirros-container-disk-demo
  - name: cloudinitdisk
    cloudInitNoCloud:
      userData: |
        #cloud-config
        password: fedora
        chpasswd: { expire: False }
        ssh_pwauth: True
