apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: webserver-vm2
  namespace: default
  labels:
    app: webserver
    instance: vm2
spec:
  running: true
  template:
    metadata:
      labels:
        app: webserver
        instance: vm2
        kubevirt.io/vm: webserver-vm2
    spec:
      domain:
        cpu:
          cores: 1
        memory:
          guest: 1Gi
        devices:
          disks:
          - name: containerdisk
            disk:
              bus: virtio
          - name: cloudinitdisk
            disk:
              bus: virtio
          interfaces:
          - name: default
            masquerade: {}
        resources:
          requests:
            memory: 1Gi
            cpu: 100m
      networks:
      - name: default
        pod: {}
      volumes:
      - name: containerdisk
        containerDisk:
          image: quay.io/kubevirt/fedora-cloud-container-disk-demo:latest
      - name: cloudinitdisk
        cloudInitNoCloud:
          userData: |
            #cloud-config
            password: fedora
            chpasswd: { expire: False }
            packages:
              - nginx
            runcmd:
              - systemctl enable nginx
              - systemctl start nginx
              - echo "<h1>Web Server VM2 - $(hostname)</h1><p>Server IP: $(hostname -I)</p>" > /var/www/html/index.html
              - systemctl restart nginx
