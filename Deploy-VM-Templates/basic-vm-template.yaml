apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: basic-vm-template
  namespace: vm-templates
  labels:
    template: basic-vm
    workload.template.kubevirt.io/server: "true"
  annotations:
    name.os.template.kubevirt.io/rhel8: Red Hat Enterprise Linux 8
    description: "Basic VM template for RHEL-family VMs with standard configuration"
objects:
- apiVersion: kubevirt.io/v1
  kind: VirtualMachine
  metadata:
    name: ${VM_NAME}
    namespace: ${NAMESPACE}
    labels:
      app: ${VM_NAME}
      template: basic-vm
  spec:
    running: false
    template:
      metadata:
        labels:
          kubevirt.io/domain: ${VM_NAME}
      spec:
        domain:
          cpu:
            cores: ${{CPU_CORES}}
          memory:
            guest: ${MEMORY}
          devices:
            disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
            interfaces:
            - name: default
              masquerade: {}
            networkInterfaceMultiqueue: true
            rng: {}
        networks:
        - name: default
          pod: {}
        volumes:
        - name: rootdisk
          containerDisk:
            image: ${DISK_IMAGE}
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              user: ${VM_USER}
              password: ${VM_PASSWORD}
              chpasswd: { expire: False }
              ssh_authorized_keys:
                - ${SSH_PUBLIC_KEY}
parameters:
- name: VM_NAME
  description: Name of the Virtual Machine
  required: true
- name: NAMESPACE
  description: Namespace for the VM
  value: vm-templates
- name: CPU_CORES
  description: Number of CPU cores
  value: "2"
- name: MEMORY
  description: Memory allocation
  value: 4Gi
- name: DISK_IMAGE
  description: Container disk image
  value: quay.io/kubevirt/fedora-cloud-container-disk-demo
- name: VM_USER
  description: VM username
  value: fedora
- name: VM_PASSWORD
  description: VM password
  value: fedora123
- name: SSH_PUBLIC_KEY
  description: SSH public key for access
  value: ""
