apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: adaptive-vm
  namespace: default
spec:
  running: true
  template:
    metadata:
      labels:
        kubevirt.io/vm: adaptive-vm
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: memory-pressure
                operator: In
                values:
                - low
          - weight: 50
            preference:
              matchExpressions:
              - key: memory-pressure
                operator: In
                values:
                - medium
      domain:
        cpu:
          cores: 2
        memory:
          guest: 4Gi
        devices:
          disks:
          - name: containerdisk
            disk:
              bus: virtio
        networks:
        - name: default
          pod: {}
      volumes:
      - name: containerdisk
        containerDisk:
          image: quay.io/kubevirt/cirros-container-disk-demo
