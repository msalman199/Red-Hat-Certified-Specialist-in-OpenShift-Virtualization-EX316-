apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: memory-intensive-vm
  namespace: default
spec:
  running: true
  template:
    metadata:
      labels:
        kubevirt.io/vm: memory-intensive-vm
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: memory-size
                operator: In
                values:
                - large
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: workload-type
                operator: In
                values:
                - high-performance
      domain:
        cpu:
          cores: 4
        memory:
          guest: 12Gi
        devices:
          disks:
          - name: containerdisk
            disk:
              bus: virtio
        networks:
        - name: default
          pod: {}
      volumes:
      - name: containerdisk
        containerDisk:
          image: quay.io/kubevirt/cirros-container-disk-demo
