apiVersion: v1
kind: Pod
metadata:
  name: health-monitor
  namespace: vm-health-probes
spec:
  containers:
  - name: monitor
    image: curlimages/curl:latest
    command: ["/bin/sh"]
    args: ["/scripts/check-health.sh"]
    volumeMounts:
    - name: script-volume
      mountPath: /scripts
  volumes:
  - name: script-volume
    configMap:
      name: health-check-script
      defaultMode: 0755
  restartPolicy: Always
