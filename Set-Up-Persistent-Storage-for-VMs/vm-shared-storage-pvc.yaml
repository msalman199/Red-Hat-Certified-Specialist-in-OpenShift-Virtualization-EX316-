apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vm-shared-storage
  namespace: vm-storage-lab
  labels:
    app: vm-storage-lab
    disk-type: shared
spec:
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  resources:
    requests:
      storage: 30Gi
  storageClassName: ocs-storagecluster-cephfs
