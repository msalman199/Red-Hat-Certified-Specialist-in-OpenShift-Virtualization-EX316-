# Create file: regular-vm.yaml
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: regular-vm
  namespace: default
spec:
  running: true
  template:
    metadata:
      labels:
        kubevirt.io/vm: regular-vm
    spec:
      tolerations:
      - key: "vm-priority"
        operator: "Equal"
        value: "regular"
        effect: "NoSchedule"
      nodeSelector:
        vm-priority: "regular"
      domain:
        devices:
          disks:
          - name: containerdisk
            disk:
              bus: virtio
          - name: cloudinitdisk
            disk:
              bus: virtio
          interfaces:
          - name: default
            masquerade: {}
        machine:
          type: ""
        resources:
          requests:
            memory: 512Mi
            cpu: 1
      networks:
      - name: default
        pod: {}
      volumes:
      - name: containerdisk
        containerDisk:
          image: quay.io/kubevirt/cirros-container-disk-demo
      - name: cloudinitdisk
        cloudInitNoCloud:
          userData: |-
            #cloud-config
            password: fedora
            chpasswd: { expire: False }
