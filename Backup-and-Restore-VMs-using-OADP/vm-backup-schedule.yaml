apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: vm-daily-backup
  namespace: openshift-adp
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  template:
    includedNamespaces:
    - default
    labelSelector:
      matchLabels:
        app: test-vm
    storageLocation: velero-sample-1
    ttl: 720h0m0s  # 30 days retention
    hooks:
      resources:
      - name: vm-backup-hook
        includedNamespaces:
        - default
        labelSelector:
          matchLabels:
            app: test-vm
        pre:
        - exec:
            command:
            - /bin/bash
            - -c
            - echo "Preparing VM for backup"
        post:
        - exec:
            command:
            - /bin/bash
            - -c
            - echo "VM backup completed"
