apiVersion: oadp.openshift.io/v1alpha1
kind: DataProtectionApplication
metadata:
  name: velero-sample
  namespace: openshift-adp
spec:
  configuration:
    velero:
      defaultPlugins:
        - openshift
        - aws
        - kubevirt
      resourceTimeout: 10m
    restic:
      enable: true
      podConfig:
        resourceAllocations:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
  backupLocations:
    - velero:
        config:
          region: us-east-1
          s3ForcePathStyle: "false"
          s3Url: https://s3.amazonaws.com
        credential:
          key: cloud
          name: cloud-credentials
        default: true
        objectStorage:
          bucket: your-backup-bucket-name
          prefix: velero
        provider: aws
  snapshotLocations:
    - velero:
        config:
          region: us-east-1
        provider: aws
