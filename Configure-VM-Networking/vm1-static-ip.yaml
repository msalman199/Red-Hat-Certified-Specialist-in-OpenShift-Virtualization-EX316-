apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: vm1-static
  namespace: vm-networking-lab
  labels:
    app: vm1-static
spec:
  running: true
  template:
    metadata:
      labels:
        kubevirt.io/vm: vm1-static
    spec:
      domain:
        devices:
          disks:
          - disk:
              bus: virtio
            name: containerdisk
          - disk:
              bus: virtio
            name: cloudinitdisk
          interfaces:
          - name: default
            masquerade: {}
          - name: static-net
            bridge: {}
        machine:
          type: ""
        resources:
          requests:
            memory: 1Gi
            cpu: 1
      networks:
      - name: default
        pod: {}
      - name: static-net
        multus:
          networkName: static-vm-network
      volumes:
      - name: containerdisk
        containerDisk:
          image: quay.io/kubevirt/fedora-cloud-container-disk-demo:latest
      - name: cloudinitdisk
        cloudInitNoCloud:
          networkData: |
            version: 2
            ethernets:
              eth1:
                addresses:
                - 192.168.100.10/24
                gateway4: 192.168.100.1
                nameservers:
                  addresses:
                  - 8.8.8.8
                  - 8.8.4.4
          userData: |
            #cloud-config
            user: fedora
            password: fedora
            chpasswd: { expire: False }
            ssh_authorized_keys:
            - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC2G...
